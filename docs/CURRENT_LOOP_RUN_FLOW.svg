<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">Pi Idea Harness 一次 Agent loop 的当前流程</title>
  <desc id="desc">展示 Pi 原生 Agent loop，以及每次模型调用前由纯本地双向上下文编译器完成事件切块、GC、正向召回、依赖闭包、三态裁决、预算装包与 Manifest 的流程。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <style>
      .title { font: 700 34px "Microsoft YaHei", "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 17px "Microsoft YaHei", "Segoe UI", sans-serif; fill: #64748b; }
      .section { font: 700 19px "Microsoft YaHei", "Segoe UI", sans-serif; fill: #1e293b; }
      .label { font: 600 16px "Microsoft YaHei", "Segoe UI", sans-serif; fill: #1e293b; }
      .small { font: 400 14px "Microsoft YaHei", "Segoe UI", sans-serif; fill: #64748b; }
      .tiny { font: 400 12px "Microsoft YaHei", "Segoe UI", sans-serif; fill: #64748b; }
      .mono { font: 600 15px Consolas, "Cascadia Mono", monospace; fill: #1e293b; }
      .white { fill: #ffffff; }
      .line { fill: none; stroke: #64748b; stroke-width: 2.3; marker-end: url(#arrow); }
      .line-blue { fill: none; stroke: #2563eb; stroke-width: 2.7; marker-end: url(#arrowBlue); }
      .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 7; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="1040" fill="#f8fafc"/>
  <text x="74" y="64" class="title">一次 Agent loop：Pi 原生主环 + Idea 上下文编译</text>
  <text x="74" y="96" class="subtitle">EPC-2L 共享核心已接入生产 Pi hook 与 benchmark；默认上下文组装不调用模型</text>

  <!-- top lifecycle -->
  <g filter="url(#shadow)">
    <rect x="74" y="132" width="1452" height="90" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
  </g>
  <text x="108" y="167" class="section">一次用户提交</text>
  <text x="108" y="198" class="mono">prompt() → runPromptMessages → runWithLifecycle → runAgentLoop</text>
  <text x="1165" y="180" class="small">Pi 保存 user message，进入 turn 0</text>

  <!-- compiler panel -->
  <g filter="url(#shadow)">
    <rect x="74" y="258" width="760" height="664" rx="24" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
  </g>
  <rect x="74" y="258" width="760" height="66" rx="24" fill="#eff6ff"/>
  <rect x="74" y="300" width="760" height="24" fill="#eff6ff"/>
  <text x="108" y="298" class="section">每次模型调用前：context 事件中的纯本地编译</text>
  <text x="716" y="298" text-anchor="end" class="small">不调用 Luna / Sol</text>

  <!-- P0 -->
  <rect x="108" y="350" width="692" height="74" rx="14" fill="#ecfeff" stroke="#22d3ee"/>
  <text x="132" y="379" class="label">P0：逐字、不可压缩、永远置于输入最前</text>
  <text x="132" y="405" class="small">只读取当前确认版本；不参与检索、GC、Heat 或摘要</text>

  <!-- delta -->
  <rect x="108" y="454" width="196" height="82" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="206" y="484" text-anchor="middle" class="label">增量读取</text>
  <text x="206" y="508" text-anchor="middle" class="small">active branch</text>
  <text x="206" y="527" text-anchor="middle" class="tiny">new SessionEntry only</text>

  <rect x="354" y="454" width="196" height="82" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="452" y="484" text-anchor="middle" class="label">原子切块</text>
  <text x="452" y="508" text-anchor="middle" class="small">user / final / thinking</text>
  <text x="452" y="527" text-anchor="middle" class="tiny">call / result / diff / error</text>

  <rect x="600" y="454" width="200" height="82" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="700" y="484" text-anchor="middle" class="label">冻结本地快照</text>
  <text x="700" y="508" text-anchor="middle" class="small">索引 + working set</text>
  <text x="700" y="527" text-anchor="middle" class="tiny">same input ⇒ same output</text>
  <path d="M304 495 L346 495" class="line"/>
  <path d="M550 495 L592 495" class="line"/>

  <!-- bidirectional -->
  <rect x="108" y="574" width="316" height="112" rx="16" fill="#fff7ed" stroke="#fb923c"/>
  <text x="132" y="607" class="label">负向：结构 GC 候选</text>
  <text x="132" y="633" class="small">只接受可证明的 dead block</text>
  <text x="132" y="658" class="tiny">thinking · UI noise · duplicate · explicit supersession</text>

  <rect x="484" y="574" width="316" height="112" rx="16" fill="#f0fdf4" stroke="#4ade80"/>
  <text x="508" y="607" class="label">正向：高置信 roots</text>
  <text x="508" y="633" class="small">本地词法 / ID / path / 状态关系</text>
  <text x="508" y="658" class="tiny">tool/user authority 只参与 KEEP 与 UNKNOWN 排序</text>
  <path d="M700 536 C700 555 664 555 642 568" class="line"/>
  <path d="M700 536 C650 552 312 550 266 568" class="line"/>

  <rect x="108" y="724" width="692" height="72" rx="14" fill="#f5f3ff" stroke="#a78bfa"/>
  <text x="132" y="753" class="label">有限图 BFS：调用、结果、文件、错误、冲突与版本依赖闭包</text>
  <text x="132" y="778" class="small">KEEP wins：依赖可覆盖 DROP 候选；每个节点/边最多访问一次</text>
  <path d="M266 686 L266 716" class="line"/>
  <path d="M642 686 L642 716" class="line"/>

  <rect x="108" y="830" width="204" height="58" rx="13" fill="#dcfce7" stroke="#22c55e"/>
  <text x="210" y="865" text-anchor="middle" class="label">KEEP</text>
  <rect x="352" y="830" width="204" height="58" rx="13" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="454" y="865" text-anchor="middle" class="label">UNKNOWN</text>
  <rect x="596" y="830" width="204" height="58" rx="13" fill="#fee2e2" stroke="#f87171"/>
  <text x="698" y="865" text-anchor="middle" class="label">DROP + 证书</text>
  <path d="M454 796 L454 822" class="line"/>

  <!-- Agent ring panel -->
  <g filter="url(#shadow)">
    <rect x="874" y="258" width="652" height="664" rx="24" fill="#ffffff" stroke="#cbd5e1"/>
  </g>
  <text x="908" y="298" class="section">Pi Agent loop（一个 turn / 一次模型调用）</text>

  <circle cx="1198" cy="584" r="210" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
  <text x="1198" y="570" text-anchor="middle" class="section">runLoop</text>
  <text x="1198" y="598" text-anchor="middle" class="small">每圈重新触发 context 编译</text>

  <circle cx="1050" cy="438" r="11" fill="#2563eb"/>
  <text x="1075" y="431" class="label">1. 注入编译结果</text>
  <text x="1075" y="454" class="small">P0 → P1 → raw evidence → request</text>

  <circle cx="1354" cy="462" r="8" fill="#64748b"/>
  <text x="1374" y="457" class="label">2. stream model</text>
  <text x="1374" y="480" class="small">仅消费上下文</text>

  <circle cx="1388" cy="650" r="8" fill="#64748b"/>
  <text x="1324" y="689" class="label">3. tool calls?</text>

  <circle cx="1198" cy="794" r="8" fill="#64748b"/>
  <text x="1198" y="830" text-anchor="middle" class="label">4. prepare → execute → finalize</text>
  <text x="1198" y="853" text-anchor="middle" class="small">按 callId 配对；结果写入 session</text>

  <circle cx="1016" cy="690" r="8" fill="#64748b"/>
  <text x="910" y="728" class="label">5. turn_end</text>
  <text x="910" y="751" class="small">toolResults 已持久化</text>

  <path d="M1061 425 C1140 350 1300 365 1347 449" class="line-blue"/>
  <path d="M1362 473 C1410 526 1417 590 1391 638" class="line"/>
  <path d="M1380 661 C1352 735 1282 780 1210 793" class="line"/>
  <path d="M1186 794 C1106 791 1044 753 1021 701" class="line"/>
  <path d="M1010 679 C967 584 979 495 1040 445" class="line-blue"/>

  <!-- cross-panel injection: all three states feed the packer; DROP contributes
       certificates only, never raw content. -->
  <path d="M312 878 C440 918 690 916 816 860" fill="none" stroke="#93c5fd" stroke-width="1.8"/>
  <path d="M556 878 C650 906 740 895 816 860" fill="none" stroke="#93c5fd" stroke-width="1.8"/>
  <path d="M800 859 L816 859" fill="none" stroke="#93c5fd" stroke-width="1.8"/>
  <circle cx="816" cy="859" r="5" fill="#2563eb"/>
  <path d="M816 859 C862 859 850 438 1036 438" class="line-blue"/>
  <text x="846" y="836" class="small">三态裁决 → 预算装包 + Manifest</text>

  <!-- exit -->
  <path d="M1198 804 L1198 958" class="dash"/>
  <rect x="938" y="950" width="520" height="58" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="1198" y="985" text-anchor="middle" class="mono">无工具 / stop → agent_end → agent_settled</text>

  <!-- notes -->
  <text x="90" y="966" class="small">工具结果存在：回到下一圈，使用新的事件 delta 重新组装不同上下文</text>
  <text x="90" y="994" class="small">没有工具：结束本次 run；原始事件保留，Manifest 只存 ID / hash / 决策原因</text>
  <text x="90" y="1024" class="tiny">蓝色箭头 = 每次模型调用的关键路径　灰色箭头 = Pi 原生生命周期　虚线 = run 结束</text>
</svg>
